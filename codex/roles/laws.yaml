# ai-editor standing laws. Every role reads this file before acting.
# prompts-template: codex-prompts-v1 rev 1.6.12 (2026-07-24)

variables:
  file_access: local      # local (default) | cas | local_ide. Governs local_mode/cas_mode/local_ide_mode and the profile-dependent parts of branch_discipline.
  local_branch: local
  cas_branch: cas
  transfer_branch: main
  escalation: strict      # strict (default) | off. User pre-sets 'off' -> law server_error_recovery is relaxed.

laws:
  active_profile_declaration: >-
    [TRIGGER: first project action] Read `variables.file_access` and state the active profile.
    It decides legitimate tools; default is `local`, only the user may change it, and a failed
    tool never authorizes switching profiles.
  branch_discipline: >-
    There are three branches: local is the local working branch, cas is the Code
    Analysis Server working branch, and main is transfer-only. Work only on the
    branch belonging to the active site. Never edit main directly and never merge
    local directly with cas. Before new work, synchronize main into the active
    working branch. Build, deploy, and run the live acceptance pipeline from the
    active working branch. Only after deployment and live verification are green,
    merge that working branch into local main. The agent MUST NOT push main. It
    reports the exact ready commit and waits for the user's explicit confirmation
    that main was pushed. After confirmation, the opposite site checks out main,
    pulls it through its authoritative Git surface, verifies the expected commit,
    checks out its own working branch, and merges main into it. The same sequence is
    mirrored when work originates on cas. Leave each site on its own working branch.
  language: >-
    Use Russian only for user-facing communication. Use English for code, comments,
    commits, prompts, child tasks and reports, Plan Manager records, and logs.
  root_tool_gate: >-
    The root orchestrator is deny-by-default. Without current explicit permission it
    uses only agent lifecycle operations and HRS/MRS Plan Manager actions. Read-only
    filesystem, shell, Git, MCP, web, build, test, deploy, and runtime calls still
    require direct permission or delegation. Tool failure grants no fallback right.
  local_mode: >-
    In the default local profile, project reads, edits, tests, builds, and release
    preparation use the local checkout on branch local. CAS remains authoritative
    for its registered server-side project and remote analysis. Commit a coherent,
    verified task result; do not push. Server-side Git operations always use CAS Git
    commands through MCP Proxy. HARD RULE (no exceptions): in this default local
    profile, EVERY script — build, test, and deploy runners alike, e.g. the command
    named in ops/delivery-release.yaml `build` — and every file edit run with LOCAL
    tools on the local checkout. MCP Proxy in this profile is used ONLY for CA
    search/analysis and CAS-authoritative git sync (never to execute a build/test/deploy
    script, never to edit a file, never via MCP Terminal sandbox or host-exec). Do not
    read host_execution's "MCP Terminal project sandbox according to the active
    profile" clause as authorizing routine local-mode script execution through the
    proxy — the sandbox/host-exec path is reserved for a genuine CAS capability gap or
    an authorized real-host incident, not for ordinary build/test/deploy.
  cas_mode: >-
    When the user explicitly selects server-side implementation, all project reads,
    edits, verification, and Git target the registered CAS project on branch cas via
    MCP Proxy. Local project tools must not be used as a fallback.
  local_ide_mode: >-
    [active when variables.file_access=local_ide] Files live locally and are edited by
    the HUMAN through the IDE; the agent NEVER edits project files directly - it
    delivers proposed patches/diffs in its reports for the human to apply. Search and
    analysis still run through CAS via MCP Proxy; sync local<->server state with Git
    (push from local, CAS git_pull_safe on the server). Branch rules follow the
    'local' clause of branch_discipline.
  level_confinement: >-
    An agent reasons only inside its declared level and supplied common/specific
    context. It labels inference, asks its direct parent for information from above,
    delegates work that belongs below, never inspects sibling-specific context, and
    never widens scope without a new delegation envelope.
  zero_trust: >-
    A child report is a claim, not evidence. Verify the actual artifact, diff, command
    result, test output, live behavior, and authoritative server state before
    acceptance. Re-check weak branches manually even when semantic scoring is green.
  codex_ts_as_retry_acceptance: >-
    In planning, medium authors/refines TS and owns formal branch acceptance; cheap executes one
    clarified narrow AS for exactly one project file. The first verified defect gets one strict
    clarified retry at the same tier. On failure, promote the unchanged clarified scope one cost
    tier and repeat; strongest-tier failure escalates upward. Semantic score is advisory only and
    an independent negative manual conscience review is the final veto before medium accepts.
  reproduce_before_claiming: >-
    Read live help/info, reproduce a failure cleanly, identify the cause, and prove the
    causal link before filing a bug or changing code. A title, old workaround, single
    transient failure, or agent statement is not proof.
  proxy_defect_bug_registration: >-
    Every discovered code defect, inaccuracy, or mismatch between observed behavior
    and description, help, or info in the MCP proxy itself or in any server accessed
    through it MUST be registered immediately as a BUG in Plan Manager and attached to
    the corresponding project before continuing. The BUG description must include the
    evidence, expected behavior, actual behavior, reproduction steps when available,
    and the confirmed project anchoring. Treat documentation or contract mismatches as
    BUGs, not TODOs.
  disk_scale_output_pagination_todo: >-
    When a command produces output so long that it must be persisted and read from
    disk, register a separate TODO in Plan Manager for the corresponding server
    project before continuing. The TODO must name the exact command and require an
    adequate pagination contract with bounded defaults and maximum limits,
    deterministic ordering, compatibility behavior for existing callers, and live MCP
    Proxy verification. The TODO must record the observed output-size or
    spill-to-disk symptom or evidence and confirm the corresponding project anchoring
    before continuing.
  server_error_recovery: >-
    [unless variables.escalation=off] STOP on the FIRST infra error (unavailable,
    timeout, 502, WAF 403, session lost): no retries, no server or session switching,
    no workarounds. Report {exact_call, verbatim_error, concrete_question} up the
    chain agent -> orchestrator -> user. escalation=off relaxes this STOP-first
    requirement. Taxonomy: Invalid parameter -> obtain command-specific help and retry
    once with the returned schema (self-correctable even under strict escalation).
    Command missing -> obtain general help, select a listed command, then obtain its
    specific help. Server unavailable -> check proxy health, registration, and
    downstream health; stop and escalate exact evidence if unhealthy. Never guess
    legacy names.
  editor_gate_no_bypass: >-
    A failed editor validation gate must be diagnosed and fixed. Never bypass syntax,
    Ruff, Flake8, mypy, import, or format validation. A false positive is a tooling bug
    to reproduce and record, not permission to weaken the gate.
  queue_semantics: >-
    A long synchronous operation may validly transition to a queued job. This is not
    an adapter leak. The shared mcp-proxy-adapter client supports synchronous emulation
    by polling and unwrapping the terminal result (auto_poll=true) and asynchronous or
    message-driven handling (auto_poll=false or manual_event_handling=true). Every
    caller must select the intended mode explicitly and test its terminal-result and
    terminal-error behavior.
  host_execution: >-
    Project work uses local tools or the MCP Terminal project sandbox according to the
    active profile. Host execution on root@192.168.254.26 is only for authorized deploy,
    real-host debugging, or service administration, never ordinary source work. CLARIFY
    (see local_mode HARD RULE): in the default local profile, "project work" including
    ALL build/test/deploy SCRIPT execution is local-tools work — the MCP Terminal
    sandbox/host-exec branch of this law does not apply to it. "Authorized deploy" here
    means administering the deploy_host itself (root@192.168.254.26) after a LOCALLY
    built artifact is ready, e.g. via ops/delivery-release.yaml `build_execution` — it is
    not license to run the build script remotely. The DECISION to perform authorized
    deploy or real-host administration remains ORCHESTRATOR-ONLY, exercised with
    conscience approval (record the date your project's user granted this); its
    MECHANICS may be delegated to the deliverer role executing the mandated
    procedure (roles/deliverer.yaml). No other role ever performs host execution or
    asks for it.
  delivery_checks: >-
    For ai-editor: run the unit suite and Ruff, bump all lockstep version files, run
    docker/build.sh (LOCAL host, local checkout, local shell — see
    ops/delivery-release.yaml `build_execution`; never via MCP Proxy or MCP
    Terminal), publish the client to PyPI at the same version, deploy to
    root@192.168.254.26, run the single live pipeline
    scripts/verify_editor_ca_chain.py against production, and verify registration
    and the changed behavior through MCP Proxy. Then apply branch_discipline.
    Reproducing a defect, proving root cause, writing the fix, and recording the
    verified Plan Manager fix before closing a bug are NOT delivery steps — that
    cycle belongs exclusively to bugfix_acceptance_cycle, the single authoritative
    definition; this law owns delivery packaging/shipping only, never diagnosis.
    OWNER: the delivery DECISION is orchestrator-level; its MECHANICS are delegated
    to the deliverer role (roles/deliverer.yaml) executing that decision;
    coder/tester gate their own steps, not delivery.
  server_client_law: >-
    A server client wraps mcp-proxy-adapter rather than reimplementing transport. It
    exposes an explicit synchronous-emulation mode and an asynchronous/message mode.
    In synchronous mode callers receive the terminal result or exception; in async
    mode a queued job/message handoff is valid. Client, server, image, and package
    versions remain aligned where the project ships those artifacts.
  bugfix_acceptance_cycle: >-
    [TRIGGER: any bug fix] The mandatory cycle is: (1) REPRODUCE on the REAL DEPLOYED SERVER;
    (2) immediately add a named covering check to the single real-server pipeline, run it against
    that server, and confirm RED. This run confirms reproduction through the pipeline, not a fix;
    no code changes precede it. (3) FIND the cause; (4) PROVE cause-to-symptom; (5) FIX with
    focused regression coverage; (6) TEST locally with `pipeline` and confirm GREEN, including
    the new check; (7) BUMP every lockstep version source; (8) BUILD locally via `docker/build.sh`;
    (9) DEPLOY to `root@192.168.254.26`, never touching the doc-store database, and publish the
    client at the same version; (10) re-run the real-server pipeline and smoke-test the original
    path. Loop from root cause if still RED. This is the sole authoritative cycle.
  single_real_server_pipeline: >-
    [once per session; applies when the current project is a server] Verify the
    project HAS a full-testing pipeline that runs against the REAL deployed
    server (scripts/verify_editor_ca_chain.py) and that it exists in EXACTLY ONE
    instance. The pipeline MUST exercise ALL API methods of the server EXCEPT the
    platform's own built-in adapter methods. A missing pipeline is a gap to close
    immediately; a duplicate is a defect to merge into the single pipeline. New
    checks always extend the existing pipeline - never create a second one. The
    invocation form of that single pipeline is fixed by `pipeline_cli_contract`.
  pipeline_cli_contract: >-
    [TRIGGER: any verification, deploy, or server start] The project MUST ship a
    pipeline package that becomes a plain CLI application after `pip install -e .`.
    The command is named `pipeline` in every project without exception, so one
    invocation works across the whole fleet. `pipeline` with no arguments runs the
    ENTIRE suite: every test and every check. `pipeline <check-name>` runs ONLY that
    check, and `pipeline --list` enumerates the available check names. This one
    command is the single verification entrypoint in every context: local
    verification before delivery, the mandatory run against the real deployed server
    after any deploy, and the smoke run after a normal server start. Never hand-roll
    a second runner, a parallel script, or an ad-hoc command list for any of those
    contexts; a missing check is added to this pipeline as a new named check. Where
    this bundle still names `scripts/verify_editor_ca_chain.py`, that script is the
    legacy form of the same single pipeline and must be migrated behind the
    `pipeline` CLI rather than duplicated. A project without this CLI has a gap that
    must be closed before the work is accepted.
  live_api_contract_coverage: >-
    [TRIGGER: any pipeline run against the real deployed server, and any change to the API
    surface] The single real-server pipeline MUST exhaustively cover EVERY exposed project API
    command and EVERY parameter in BOTH directions. Each parameter gets a valid declared-type
    value including boundaries, optionals both present and absent, and named negative checks for
    required omission, empty/null, wrong type, malformed/out-of-range/unsupported value, and an
    unknown extra parameter rejection. Assert the exact status or error code, response shape,
    every promised property present, every unpromised property absent, and every value type
    recursively through nested objects and list elements, plus exact fixed values; negatives assert the
    specific contracted error. No-exception/HTTP-200 acceptance, serialized-body substrings,
    happy-path-only coverage, or check counts are forbidden. An untested command, one-directional
    parameter, or loose response assertion is a coverage gap: add its named check to the existing
    single pipeline, never a second runner. The platform's built-in adapter methods remain only
    the exclusion already defined by `single_real_server_pipeline`. See `ops/testing.yaml`.
  template_prompt_reconciliation: >-
    [once per session] Reconcile the project's prompt bundle with its source
    template archive (claude: /home/vasilyvz/projects/prompts/claude-prompts-v1.6.15.tar.gz;
    codex: /home/vasilyvz/projects/prompts/codex-prompts-v1.6.15.tar.gz). The model
    REQUESTS the user's permission to update; only after the user confirms does
    it diff template vs project bundle and update the project prompt, preserving
    project-specific placeholder values. Template improvements flow back to the
    template only on the user's explicit order.
