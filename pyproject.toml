[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-editor"
# Version comes from the repository-root VERSION file (see
# [tool.setuptools.dynamic] below) -- the single source of truth shared by this
# server distribution, ai-editor-client and ai-editor-tree-engine. Never
# reintroduce a literal here; tests/unit/test_version_pinning.py fails if any of
# the three carries its own number.
dynamic = ["version"]
description = "AI Editor MCP server: universal file preview, open, edit, write, and close"
readme = { file = "docs/README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Vasiliy Zdanovskiy", email = "vasilyvz@gmail.com" },
]
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "click>=8.0",
    "mcp>=1.0.0",
    "pydantic>=2.1.0",
    "lark>=1.1.0",
    "libcst>=1.1.0",
    "mcp-proxy-adapter>=8.10.21",
    "code-analysis-client>=1.0.9",
    "queuemgr>=1.0.20",
    "dulwich>=1.2.4",
    "markdown-it-py>=3.0",
    "black>=24.0",
    "flake8>=7.0",
    "ruff>=0.6.0",
    "mypy>=1.8",
    # The editor's tree internals, now their own distribution built from src/.
    # The pin is EXACT and equal to VERSION: the engine owns node identity and
    # the on-disk tree file, so a mismatched engine can write a tree file this
    # server cannot read back. tests/unit/test_version_pinning.py fails if this
    # number ever diverges from VERSION.
    # NOT ON PyPI YET: until the first publish this requirement is satisfied by
    # the local build (`pip install ./src[tree-engine]`, which requirements.txt
    # and docker/Dockerfile do before installing this project).
    "ai-editor-tree-engine==1.0.96",
]
# PostgreSQL logical backup (backup_database / restore_database) also needs OS binaries
# pg_dump and pg_restore (e.g. Debian/Ubuntu: apt install postgresql-client). Pip cannot
# install them. Optional extra `postgres-backup` is a marker: `pip install -e ".[postgres-backup]"`.

[project.optional-dependencies]
# Empty extra: documents that operators should install postgresql-client for pg_dump/pg_restore.
postgres-backup = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.4",
    "pytest-cov>=7.0",
    "anyio>=4.0",
    "black>=24.0",
    "flake8>=7.0",
    "ruff>=0.6.0",
    "mypy>=1.8",
]

# --- Development dependency groups (narrower than the aggregate `dev` above,
# which is kept unchanged for existing callers). Each group lists only tools
# that are actually present and actually used in this repository.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-timeout>=2.4",
    "pytest-cov>=7.0",
    "anyio>=4.0",
]
typecheck = [
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]
quality = [
    "black>=24.0",
    "flake8>=7.0",
    "ruff>=0.6.0",
]
# Empty extra, same marker pattern as `postgres-backup` above: this repository
# ships NO documentation build toolchain today (a repo-wide search for sphinx /
# mkdocs / pdoc / myst in *.toml, *.txt, *.cfg, *.ini, *.yaml, *.yml returns
# nothing). Docs are hand-written Markdown under docs/. This group is the
# declared slot for that toolchain; it is deliberately left empty rather than
# naming a documentation generator this project has never used.
docs = []

# --- tree_engine backend extras -------------------------------------------
# These four extras are the SAME four carried by src/pyproject.toml, the
# ai-editor-tree-engine distribution that now owns the tree_engine package.
# They are kept here verbatim so `pip install ai-editor[tree-engine]` keeps
# behaving exactly as before; tests/unit/test_version_pinning.py fails if the
# two files' backend extras ever stop agreeing, so the duplication cannot rot.
# src/tree_engine/ is format-independent by construction: pipeline/checks/
# check_boundary.py statically rejects any import of libcst / ast / tree_sitter /
# tree_sitter_bsl outside src/tree_engine/plugins/. The backends below are
# therefore genuinely optional -- the core, the storage layer and the
# plain_text / json_format / toml_format plugins are stdlib-only and need none
# of them. Install only the translator(s) you use.
#
# Version lines below are the MEASURED, round-trip-verified ones in this
# checkout, not copied from the plan text; see docs/release_identity.md §7 and
# docs/release_manifest.md ("Installed third-party versions").
#
# BACKEND MAJOR-UPGRADE RE-GATE RULE ({p032}): a MAJOR-version change of any
# backend dependency pinned in these extras (libcst, tree-sitter,
# tree-sitter-bsl, lark) REQUIRES re-running the contract and round-trip gate
# before publication. The upper bounds below are what makes that rule
# mechanical: crossing one is an explicit, reviewed edit of this file, never an
# accidental resolver upgrade.
#
# libcst: 1.8.6 is installed and verified here (byte-identical round-trip of a
# real module through tree_engine.plugins.python.plugin.PythonFormatPlugin).
tree-engine-python = ["libcst>=1.8.6,<2.0"]
# tree-sitter: DELIBERATE DIVERGENCE from the plan's "0.24.x" pin. The BSL
# grammar shipped by tree-sitter-bsl 0.1.6 reports ABI version 15
# (tree_sitter.Language(tree_sitter_bsl.language()).abi_version == 15). The
# installed tree-sitter 0.25.2 declares LANGUAGE_VERSION == 15 with
# MIN_COMPATIBLE_LANGUAGE_VERSION == 13; the 0.24 line tops out below 15 and
# cannot load this grammar. Verified by execution: BSLFormatPlugin parses a real
# 1C module on 0.25.2 and renders it back byte-identically.
tree-engine-bsl = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bsl>=0.1.6,<0.2",
]
# lark: required only by tree_engine/query/selector.py (the selector grammar).
tree-engine-query = ["lark>=1.3.1,<2.0"]
# Aggregate: every tree_engine backend at once.
tree-engine = [
    "libcst>=1.8.6,<2.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bsl>=0.1.6,<0.2",
    "lark>=1.3.1,<2.0",
]

[tool.setuptools.dynamic]
# One number for three distributions (server, client, engine). VERSION is a
# real file at the repository root; client/ai_editor_client/version.txt and
# src/VERSION are symlinks to it, because setuptools refuses to read a version
# file outside a distribution's own root (expand._assert_local).
version = { file = "VERSION" }

# Flat-layout discovery for the server's own packages only. `tree_engine*` is
# deliberately ABSENT: the package ships from exactly one place now, the
# ai-editor-tree-engine distribution built from src/pyproject.toml, and this
# project depends on it. `namespaces = true` stays load-bearing here too --
# ai_editor/core/ has no __init__.py, so it is an implicit namespace package
# (PEP 420) and a regular-package finder would drop it.
[tool.setuptools.packages.find]
where = ["."]
include = ["ai_editor*", "aiedmgr_entry*"]
namespaces = true

[tool.setuptools.package-data]
"ai_editor.config_templates" = ["*.json"]
# ai_editor/VERSION is a symlink to the repository-root VERSION file and is THE
# runtime version declaration read by ai_editor/version.py, on which the
# server<->engine startup guard depends. It must ship inside the wheel:
# `importlib.metadata` records what was written at INSTALL time and goes stale
# on an editable install, whereas these bytes are what the build actually is.
# sdist/wheel builds copy the resolved content, so an installed wheel carries a
# real file, never a dangling link.
"ai_editor" = ["VERSION"]

# Portable shell launcher (#!/usr/bin/env bash); not pip console_scripts with host shebang.
[tool.setuptools]
script-files = ["scripts/aiedmgr", "scripts/aiedcfg", "scripts/pipeline"]

[tool.ruff]
line-length = 88
include = [
    "ai_editor/core/code_quality/**/*.py",
    "ai_editor/core/file_validation/**/*.py",
    "ai_editor/core/cst_module/**/*.py",
    "tests/unit/test_quality_tools_mypy_config.py",
    "tests/test_type_checker_mypy_semantics.py",
    "scripts/verify_editor_ca_chain.py",
    "tests/test_verify_editor_ca_chain.py",
]
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "env",
    "ENV",
    "env.bak",
    "venv.bak",
    ".eggs",
    "docs/ai_reports",
    "scripts",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
